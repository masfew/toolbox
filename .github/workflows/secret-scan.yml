# Scans every commit for secrets with gitleaks, on every push and pull request.
# The gitleaks release is pinned and its checksum checked, and actions/checkout
# is pinned to a commit. To update gitleaks, change both values below to the
# new release and the SHA-256 of its linux_x64 archive from the release's
# checksums file.
# A second job checks the tool folders' names: no two may share a name, since
# release tags, zips and install paths use only the name, and each must be
# lowercase words joined by hyphens. It runs .github/scripts/release_notes.py
# with the runner's own Python.
# A third job checks that better-plans' plan.css and artifact-style's house.css
# still share their colour and font tokens.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every commit
        run: gitleaks git --redact --verbose --exit-code 1 .

  tool-names:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tool folder names
        run: python3 .github/scripts/release_notes.py --check-names

  plan-css-sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check plan.css and house.css share their tokens
        run: python3 -I skills/artifact-style/tests/check_sync.py
